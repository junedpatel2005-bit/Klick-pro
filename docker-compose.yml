services:
  postgres:
    image: postgres:16-alpine
    container_name: klickpro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klickpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-KlickProSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-klickpro_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klickpro} -d ${POSTGRES_DB:-klickpro_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: klickpro-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-klickpro}:${POSTGRES_PASSWORD:-KlickProSecure2026!}@postgres:5432/${POSTGRES_DB:-klickpro_prod}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      REALTIME_ALLOWED_ORIGIN: ${REALTIME_ALLOWED_ORIGIN:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

volumes:
  pgdata:
    driver: local
