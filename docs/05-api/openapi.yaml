      security:
        - {}
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - role
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneNumber'
                role:
                  $ref: '#/components/schemas/AccountRole'
      responses:
        '200':
          description: '{success: true}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTrue'
        '400':
          description: 'Error with a human-readable message: {error: string}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: 'Error with a human-readable message: {error: string}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: 'Error with a human-readable message: {error: string}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '503':
          description: 'Error with a human-readable message: {error: string}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
