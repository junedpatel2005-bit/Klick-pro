  /api/portal/invoices/{paymentId}:
    get:
      tags:
        - Portal
      operationId: portalInvoicePdf
      summary: Download invoice PDF for a COMPLETED payment (creates Invoice row on first request)
      x-source: app/api/portal/invoices/[paymentId]/route.tsx:7-85
      security:
        - cookieAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      description: >-
        Caller must be ADMIN or the payment client/professional. Side effect: invoice.upsert (INV-<year>-<paymentId
        padded 6>). PDF includes both parties' name, email, phone and address.
      responses:
        '200':
          description: Invoice PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid payment ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sign-in required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Completed payment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: servio_session
      description: >-
        HS256 JWT {userId, role, sessionId} issued by src/lib/auth.ts createSession; validated against the sessions
        table on every request. Same cookie for clients, professionals and admins — role is inside the token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Same session JWT sent as Authorization: Bearer. Accepted only by the few handlers noted per operation.'
  schemas:
