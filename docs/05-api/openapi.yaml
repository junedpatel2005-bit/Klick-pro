# Last verified against code: 2026-09-16 (commit cd8f4fb); runtime-validated 2026-09-17
# Generated by merging reverse-engineered fragments. Edit alongside code changes.
openapi: 3.1.0
info:
  title: Klick-Pro (servio) HTTP API
  version: 0.0.0-reverse-engineered
  description: >-
    Reverse-engineered from source at commit cd8f4fb (verified 2026-09-16). Source of truth is the implementation; every
    operation carries x-source file:line.


    Conventions and caveats:

    - Responses are raw NextResponse.json; errors are mostly {"error": string}. The apiSuccess/apiError envelope in
    src/lib/api-response.ts is not used.

    - Every POST/PUT/PATCH/DELETE under /api/* must carry an Origin header equal to the app origin or APP_URL, otherwise
    proxy.ts returns 403 {"error":"Request origin is not allowed."}. This applies to webhooks and non-browser clients
    too. Under the custom server only the exact APP_URL origin passes in practice; a genuine same-origin request to a
    different host (e.g. 127.0.0.1 when APP_URL is localhost) also gets 403. [VALIDATED 2026-09-17 · V-20]

    - /api/v1/:path* is rewritten to /api/:path* (next.config.ts, afterFiles). Physical routes /api/v1/messages and
    /api/v1/professionals take precedence and have no /api/* twin. /api/v1/v1/* is not rewritten twice and returns
    404. [VALIDATED 2026-09-17 · V-13]

    - Schemas marked [NEEDS VALIDATION] could not be fully established from code; no properties were invented.

    - Realtime Socket.IO events (path /api/realtime) are documented in docs/05-api/api-specification.md, not here.


    Human-readable reference: docs/05-api/api-specification.md
servers:
  - url: /
    description: Same origin as the web app (custom server.mjs)
tags:
  - name: Auth
    description: >-
      Registration, login (password, phone OTP, Google OAuth), sessions, email verification, password reset —
      app/api/auth
  - name: Admin
    description: Admin-only operations — app/api/admin (requires role ADMIN)
  - name: Verification
    description: Identity / KYC verification (Persona) and verification documents
  - name: CMS
    description: File-based CMS content management (admin)
  - name: Reports
    description: PDF/CSV report exports
  - name: System
    description: Operational/diagnostic endpoints
  - name: Profile
    description: Account profile, avatar, saved locations — app/api/profile
  - name: Webhooks
    description: >-
      Inbound provider webhooks (Razorpay, Persona). NOTE: currently blocked by proxy.ts Origin check (POST without
      Origin returns 403, validated locally 2026-09-17 · V-20) — see api-specification.md
  - name: Public
    description: Unauthenticated public utilities (contact, geocode, search)
  - name: Dashboard
    description: Dashboard aggregates
  - name: Client
    description: Client-role operations — app/api/client
  - name: Professional
    description: Professional-role operations — app/api/professional
  - name: Portal
    description: Shared portal resources for signed-in users — app/api/portal/[resource]
  - name: Project Actions
    description: Project tracking state machine — app/api/portal/project-actions
  - name: Marketplace
    description: Job/professional marketplace listings — app/api/marketplace
  - name: Payments
    description: Razorpay orders and verification — app/api/payments
  - name: Wallet
    description: Wallet balance, deposits, withdrawals — app/api/wallet
  - name: Messaging
    description: Direct messages — app/api/v1/messages
  - name: Discovery
    description: Professional discovery search — app/api/v1/professionals
paths:
  /api/auth/google:
    get:
      tags:
        - Auth
      operationId: authGoogle
      summary: Google OAuth start (no code) or callback (with code)
      x-source: app/api/auth/[action]/route.ts:101-222
      security: []
      parameters:
        - in: query
          name: role
          required: false
          schema:
            type: string
            enum:
              - CLIENT
              - PROFESSIONAL
          description: Role for newly created accounts; anything other than PROFESSIONAL means CLIENT.
        - in: query
          name: next
          required: false
          schema:
            type: string
          description: Post-login path; accepted if it starts with / and not //.
        - in: query
          name: code
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        '302':
          description: >-
            Redirect to Google (start), to the post-login page with servio_session set (callback success), or to
            /login?oauthError=google-not-configured|google-failed.
  /api/auth/me:
    get:
      tags:
        - Auth
      operationId: authMe
      summary: Current user or null
      x-source: app/api/auth/me/route.ts:5-47
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user, or user null when unauthenticated, invalid, or inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
