    ProjectActionInput:
      description: >-
        zod discriminatedUnion on action (app/api/portal/project-actions/route.ts:11-117). projectId is required in
        every variant.
      oneOf:
        - type: object
          required:
            - action
            - projectId
            - title
            - amount
          properties:
            action:
              const: create-milestone
            projectId:
              type: integer
              minimum: 1
            title:
              type: string
              minLength: 2
              maxLength: 160
            amount:
              type: integer
              minimum: 0
            description:
              type:
                - string
                - 'null'
              maxLength: 2000
            deadline:
              type:
                - string
                - 'null'
              format: date-time
        - type: object
          required:
            - action
            - projectId
            - milestones
          properties:
            action:
              const: create-milestones
            projectId:
              type: integer
              minimum: 1
            milestones:
              type: array
              minItems: 1
              maxItems: 50
              items:
                type: object
                required:
                  - title
                  - amount
                properties:
                  title:
                    type: string
                    minLength: 1
                    maxLength: 160
                  amount:
                    type: integer
                    minimum: 0
                  description:
                    type:
                      - string
                      - 'null'
                    maxLength: 2000
                  deadline:
                    type:
                      - string
                      - 'null'
                    format: date-time
        - type: object
          required:
            - action
            - projectId
            - milestoneId
            - title
            - amount
          properties:
            action:
              const: update-milestone
            projectId:
              type: integer
              minimum: 1
            milestoneId:
              type: integer
              minimum: 1
            title:
              type: string
              minLength: 1
              maxLength: 160
            amount:
              type: integer
              minimum: 0
            description:
              type:
                - string
                - 'null'
              maxLength: 2000
        - type: object
          required:
            - action
            - projectId
            - milestoneId
          properties:
            action:
              const: delete-milestone
            projectId:
              type: integer
              minimum: 1
            milestoneId:
              type: integer
              minimum: 1
        - type: object
          required:
            - action
            - projectId
          properties:
            action:
              const: start-work
            projectId:
              type: integer
              minimum: 1
        - type: object
          required:
            - action
            - projectId
            - progress
          properties:
            action:
              const: update-progress
            projectId:
              type: integer
              minimum: 1
            progress:
              type: integer
              minimum: 0
              maximum: 100
            stage:
              type:
                - string
                - 'null'
              maxLength: 160
            note:
              type:
                - string
                - 'null'
              maxLength: 2000
        - type: object
          required:
            - action
            - projectId
            - title
            - attachmentIds
          properties:
            action:
              const: upload-work
            projectId:
              type: integer
              minimum: 1
            milestoneId:
              type:
                - integer
                - 'null'
              minimum: 1
            title:
              type: string
              minLength: 2
              maxLength: 160
            note:
              type:
                - string
                - 'null'
              maxLength: 2000
            attachmentIds:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: integer
                minimum: 1
        - type: object
          required:
            - action
            - projectId
            - milestoneId
            - note
            - attachmentIds
          properties:
            action:
              const: submit-milestone
            projectId:
              type: integer
              minimum: 1
            milestoneId:
              type: integer
              minimum: 1
            note:
              type: string
              minLength: 2
              maxLength: 2000
            attachmentIds:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: integer
                minimum: 1
        - type: object
          required:
            - action
            - projectId
            - milestoneId
            - note
          properties:
            action:
              const: request-revision
            projectId:
              type: integer
              minimum: 1
            milestoneId:
              type: integer
              minimum: 1
            note:
              type: string
              minLength: 2
              maxLength: 2000
        - type: object
          required:
            - action
            - projectId
            - milestoneId
          properties:
            action:
              const: approve-milestone
            projectId:
              type: integer
              minimum: 1
            milestoneId:
              type: integer
              minimum: 1
        - type: object
          required:
            - action
            - projectId
            - note
            - attachmentIds
          properties:
            action:
              const: submit-final-work
            projectId:
              type: integer
              minimum: 1
            note:
              type: string
              minLength: 2
              maxLength: 2000
            attachmentIds:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: integer
                minimum: 1
        - type: object
          required:
            - action
            - projectId
            - note
          properties:
            action:
              const: request-client
            projectId:
              type: integer
              minimum: 1
            title:
              type: string
              minLength: 2
              maxLength: 160
            note:
              type: string
              minLength: 2
              maxLength: 2000
        - type: object
          required:
            - action
            - projectId
          properties:
            action:
              const: complete-project
            projectId:
              type: integer
              minimum: 1
        - type: object
          required:
            - action
            - projectId
          properties:
            action:
              const: confirm-project-completion
            projectId:
              type: integer
              minimum: 1
        - type: object
          required:
            - action
            - projectId
            - response
          properties:
            action:
              const: respond-to-review
            projectId:
              type: integer
              minimum: 1
            response:
              type: string
              minLength: 2
              maxLength: 2000
        - type: object
          required:
            - action
            - projectId
            - rating
          properties:
            action:
              const: submit-review
            projectId:
              type: integer
              minimum: 1
            rating:
              type: integer
              minimum: 1
              maximum: 5
            comment:
              type:
                - string
                - 'null'
              maxLength: 2000
        - type: object
          required:
            - action
            - projectId
            - issueType
            - message
          properties:
            action:
              const: submit-dispute
            projectId:
              type: integer
              minimum: 1
            issueType:
              type: string
              minLength: 2
              maxLength: 80
            priority:
              type: string
              enum:
                - LOW
                - MEDIUM
                - HIGH
              default: MEDIUM
            message:
              type: string
              minLength: 10
              maxLength: 4000
